spring:
  application:
    name: vistay-finance-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vistay_finance_db}
    username: ${DB_USERNAME:vistay}
    password: ${DB_PASSWORD:vistay}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:4}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      schema: app
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
  flyway:
    enabled: true
    default-schema: app
    schemas: app
    create-schemas: true
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:http://identity.localhost/realms/vistay-backoffice}
          jwk-set-uri: ${JWT_JWKS_URI:http://keycloak:8080/realms/vistay-backoffice/protocol/openid-connect/certs}
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:}
      ssl.truststore.password: ${KAFKA_TRUSTSTORE_PASSWORD:}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: vistay-finance-payment-confirmed-v1
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        isolation.level: read_committed
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}
    client:
      channel:
        user:
          target: ${USER_GRPC_ADDRESS:static://localhost:9091}
          ssl:
            bundle: ${USER_GRPC_SSL_BUNDLE:grpc-user-client}
        booking:
          target: ${BOOKING_GRPC_ADDRESS:static://localhost:9092}
          ssl:
            bundle: ${BOOKING_GRPC_SSL_BUNDLE:grpc-user-client}
  ssl:
    bundle:
      pem:
        grpc-user-client:
          keystore:
            certificate: ${GRPC_CLIENT_CERT:file:/run/secrets/grpc/finance.crt}
            private-key: ${GRPC_CLIENT_KEY:file:/run/secrets/grpc/finance.key}
          truststore:
            certificate: ${GRPC_SERVER_CA_CERT:file:/run/secrets/grpc/ca.crt}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

vistay:
  security:
    audience: ${JWT_AUDIENCE:vistay-backoffice-api}
  topics:
    authorization-changed: ${AUTHORIZATION_CHANGED_TOPIC:vistay.user.authorization-changed.v1}
  authorization:
    local-cache-ttl: ${AUTHORIZATION_LOCAL_CACHE_TTL:30s}
    grpc-deadline: ${AUTHORIZATION_GRPC_DEADLINE:2s}

logging:
  structured:
    format:
      console: logstash
